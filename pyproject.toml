[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-jerk-control"
version = "0.1.0"
description = "Fly-connectome-informed residual control for smooth stopping under changing dynamics"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Research engineering" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "gymnasium>=0.29",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ruckig = ["ruckig>=0.12"]

[project.scripts]
fly-jerk-control = "fly_jerk_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools]
package-dir = { "" = "src" }
